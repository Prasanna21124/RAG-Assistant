# ─────────────────────────────────────────────────────────────
# RAG Pipeline Configuration
# Edit these values to customize the behaviour of your RAG bot.
# ─────────────────────────────────────────────────────────────

llm:
  model: gemini-1.5-flash   # Google Gemini model (1,500 requests/day on free tier)
  temperature: 0.2          # 0.0 = factual / deterministic  |  1.0 = creative
  max_tokens: 1024          # Maximum tokens in each response

retrieval:
  k: 5                      # Number of chunks retrieved per query (each retriever)
  chunk_size: 500           # Characters per chunk when splitting documents
  chunk_overlap: 50         # Overlap between consecutive chunks
  bm25_weight: 0.4          # Weight for BM25 (keyword-based) retriever
  semantic_weight: 0.6      # Weight for FAISS (semantic / embedding) retriever

paths:
  data_folder: data/        # Folder where source documents are stored
  index_path: faiss_index/  # Folder where the FAISS index is persisted on disk
  sessions_dir: sessions/   # Folder where per-session chat history JSON files live
